name: flutter_python_bridge
description: A Flutter library that allows developers to run Python code directly in Flutter applications, with support for ML, data analysis, and image processing.
version: 0.1.0
homepage: https://github.com/Hamed233/flutter_python_bridge
repository: https://github.com/Hamed233/flutter_python_bridge
issue_tracker: https://github.com/Hamed233/flutter_python_bridge/issues
documentation: https://github.com/Hamed233/flutter_python_bridge/blob/main/README.md

environment:
  sdk: ">=2.17.0 <4.0.0"
  flutter: ">=1.20.0"

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.4
  path_provider: ^2.1.5
  http: ^1.3.0
  chaquopy: ^0.0.20
  process_run: ^1.2.4
  path: ^1.9.1
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.example.flutter_python_bridge
        pluginClass: FlutterPythonBridgePlugin
      ios:
        pluginClass: FlutterPythonBridgePlugin
